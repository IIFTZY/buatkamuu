<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
    }

    .card {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
      animation: muncul 1s ease;
    }

    @keyframes muncul {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .heart {
      font-size: 70px;
      animation: detak 1s infinite;
      margin-bottom: 15px;
    }

    @keyframes detak {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    h1 {
      color: #ff4f70;
      margin-bottom: 15px;
      font-size: 30px;
    }

    p {
      color: #555;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background: #ff4f70;
      color: white;
    }

    .yes:hover {
      transform: scale(1.1);
      background: #ff3158;
    }

    .no {
      background: #eee;
      color: #555;
    }

    .no:hover {
      transform: translateX(80px);
    }

    .floating-heart {
      position: absolute;
      bottom: -50px;
      font-size: 25px;
      animation: naik 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes naik {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .h1 { left: 10%; animation-delay: 0s; }
    .h2 { left: 30%; animation-delay: 2s; }
    .h3 { left: 55%; animation-delay: 1s; }
    .h4 { left: 80%; animation-delay: 3s; }

    #jawaban {
      display: none;
      color: #ff4f70;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- Hati yang terbang -->
  <div class="floating-heart h1">❤️</div>
  <div class="floating-heart h2">💕</div>
  <div class="floating-heart h3">💗</div>
  <div class="floating-heart h4">💖</div>

  <div class="card">

    <div class="heart">❤️</div>

    <h1> UNTUK KAMU</h1>

<p>
      <b>Maukah kamu jadi pacarku? 🥺❤️</b>
    </p>

    <div class="buttons">
      <button class="yes" onclick="diterima()">
        Mau 
      </button>

      <button class="no" onclick="ditolak()">
        Nggak 
      </button>
    </div>

    <div id="jawaban">
      YEAYYY! ❤️🥹<br>

    </div>

  </div>

  <script>
    function diterima() {
      document.getElementById("jawaban").style.display = "block";

      document.querySelector(".buttons").style.display = "none";

      document.querySelector("h1").innerHTML = "KITA JADIAN! ❤️";
    }

    function ditolak() {
      alert("Yakin nggak mau? 🥺❤️");
    }
  </script>

</body>
</html>
